services:
  - type: web
    name: civicpulse-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: RAG_SERVICE_URL
        value: http://civicpulse-rag:10000

  - type: web
    name: civicpulse-rag
    env: python
    plan: free
    rootDir: rag_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
